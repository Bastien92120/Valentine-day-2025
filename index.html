<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Will You Be My Valentine? 💝</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="floating"></div>
  <main class="card">
    <h1 id="page-title">Will You Be My Valentine? 💝</h1>

    <section id="q1" class="question">
      <p class="q-text">Do you like me?</p>
      <div class="btns">
        <button id="q1-yes" class="btn">Yes</button>
        <button id="q1-no" class="btn evasive">No</button>
      </div>
      <p id="q1-secret" class="secret" hidden>I don't like you, I love you! ❤️</p>
    </section>

    <section id="q2" class="question" hidden>
      <p class="q-text">How much do you love me?</p>
      <div class="meter">
        <div class="slider-container">
          <input type="range" id="love-slider" min="0" max="5000" value="0" class="love-slider">
        </div>
        <div id="percent">0%</div>
      </div>
      <p id="love-msg" class="secret" hidden>And beyond! 🥰</p>
      <div class="btns">
        <button id="q2-next" class="btn">Next ❤️</button>
      </div>
    </section>

    <section id="q3" class="question" hidden>
      <p class="q-text">Will you be my Valentine...?</p>
      <div class="btns">
        <button id="q3-yes" class="btn">Yes!</button>
        <button id="q3-no" class="btn evasive">No</button>
      </div>
    </section>

    <section id="celebrate" class="question" hidden>
      <h2 id="cele-title">Yay! I'm the luckiest person...</h2>
      <p id="cele-msg">Cadeau : 1 week-end ici :</p>
      <a id="cele-link" href="https://www.staycation.co/fr/hotels/chateau-de-bourron-2523?coords=48.853495%2C2.348392" target="_blank" class="castle-emoji">🏰</a>
      <div id="cele-emojis" class="cele-emojis">🎁💖🤗💝💋❤️💕</div>
      <div class="btns">
        <button id="music-toggle" class="btn">🎵 Play Music</button>
      </div>
    </section>

  </main>
  <audio id="bg-music" crossorigin="anonymous"></audio>
  <script src="script.js"></script>
</body>
</html>
